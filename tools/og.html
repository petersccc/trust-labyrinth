<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Link preview image (tool)</title>
<!--
  Tool page, not part of the labyrinth: the 1200 x 630 link preview
  image in the site design. Texts come from content.js. Render with
  headless Edge, one per language:
    msedge --headless=new --window-size=1200,630 --screenshot=og/og-image-de.jpg
      http://localhost:8745/tools/og.html?lang=de
  (the screenshot is PNG data; tools/make-og.ps1 converts it to JPEG).
-->
<style>
  @font-face { font-family: Italiana; src: url("../fonts/italiana.woff2") format("woff2"); }
  @font-face { font-family: Cormorant; src: url("../fonts/cormorant-italic.woff2") format("woff2"); font-style: italic; font-weight: 300 700; }
  :root { --ink: #111; --muted: #6b6b6b; --feldgrau: #536969; --jasper: #C16952; --light: #F2F2F0; --line: #DADADA; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--light); }
  .card { position: absolute; left: 90px; top: 85px; width: 1020px; height: 460px; background: #fff;
    border-top: 6px solid var(--feldgrau); box-shadow: 0 20px 60px rgba(0,0,0,.08); box-sizing: border-box;
    display: flex; align-items: center; gap: 64px; padding: 0 80px; }
  img { width: 250px; height: 250px; flex: 0 0 250px; border-radius: 50%; object-fit: cover;
    border: 5px solid #fff; box-shadow: 0 0 0 3px var(--feldgrau); }
  .card > div { flex: 1; min-width: 0; }
  :lang(de) h1 { font-size: 66px; }
  .lbl { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: Italiana, serif; font-weight: 400; font-size: 82px; line-height: 1.05; letter-spacing: .03em; color: var(--ink); margin: 18px 0 26px; }
  :lang(zh) h1 { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-weight: 600; font-size: 76px; letter-spacing: .08em; }
  .cap { font-family: Cormorant, Georgia, serif; font-style: italic; font-size: 34px; color: var(--ink); padding-top: 18px; border-top: 1.5px solid var(--line); }
  :lang(zh) .cap { font-family: "Microsoft YaHei", sans-serif; font-style: normal; font-size: 28px; }
  .arrow { color: var(--jasper); font-family: "Segoe UI", Arial, sans-serif; margin-left: 12px; }
</style>
</head>
<body>
<div class="card">
  <img src="../img/photo-1.jpg" alt="">
  <div>
    <div class="lbl">Peters Cross-Cultural Communication</div>
    <h1 id="title"></h1>
    <div class="cap" id="cap"></div>
  </div>
</div>
<script src="../content.js"></script>
<script>
  const lang = ["de", "en", "zh"].includes(new URLSearchParams(location.search).get("lang"))
    ? new URLSearchParams(location.search).get("lang") : "de";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  const get = (el) => CONTENT.slide_1_opening.find((e) => e.element === el)[lang];
  document.getElementById("title").textContent = get("Title");
  document.getElementById("cap").textContent = get("Caption under photo");
</script>
</body>
</html>
